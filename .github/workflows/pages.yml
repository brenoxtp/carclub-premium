name: Build, prévia e publicação Car Club Premium

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: carclub-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run check
      - name: Gerar site
        run: npm run build
      - name: Atualizar prévia pública no repositório
        run: |
          mkdir -p preview
          rm -rf preview/assets
          cp -R dist/. preview/
          cp privacidade.html preview/privacidade.html
          touch preview/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A preview
          if git diff --cached --quiet; then
            echo "Prévia sem alterações."
          else
            git commit -m "chore: update browser preview [skip ci]"
            git push origin HEAD:main
          fi
      - name: Arquivar arquivos do site
        uses: actions/upload-artifact@v4
        with:
          name: carclub-site
          path: dist/

  deploy:
    if: github.event.repository.has_pages == true
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter artefato
        uses: actions/download-artifact@v4
        with:
          name: carclub-site
          path: dist/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
