name: Build e publicar Car Club Premium

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: carclub-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run check
      - name: Gerar site
        run: npm run build
        env:
          VITE_BASE_PATH: /carclub-premium/
      - name: Salvar arquivos
        uses: actions/upload-artifact@v4
        with:
          name: carclub-site
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter artefato
        uses: actions/download-artifact@v4
        with:
          name: carclub-site
          path: dist/
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
